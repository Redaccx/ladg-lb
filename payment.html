<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طرق التبرع - الجمعية اللبنانية للأنماء</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#dbe4f0);
  text-align:center;
  color:#333;
}

/* LANGUAGE BUTTON */
.language-toggle{
  position:fixed;
  top:15px;
  left:15px;
  background:#c1272d;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:25px;
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
  box-shadow:0 5px 12px rgba(0,0,0,0.15);
}
.language-toggle:hover{
  transform:scale(1.05);
}

/* LOGO */
.logo img{
  width:130px;
  margin-top:60px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

/* TITLE */
h1{
  color:#c1272d;
  margin-top:15px;
  font-size:26px;
}

/* DESCRIPTION */
.description{
  max-width:650px;
  margin:15px auto 30px;
  font-size:15px;
  line-height:1.8;
  color:#555;
  padding:0 15px;
}

/* CONTAINER */
.payment-methods{
  max-width:420px;
  margin:auto;
  padding:0 15px 40px;
}

/* CARD */
.payment-option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  border-radius:16px;
  padding:14px 16px;
  margin:12px 0;
  text-decoration:none;
  color:#333;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  border:1px solid transparent;
  transition:0.3s;
}

.payment-option:hover{
  transform:translateY(-5px);
  border-color:#c1272d;
  box-shadow:0 15px 30px rgba(193,39,45,0.2);
}

/* TEXT */
.payment-option span{
  font-size:17px;
  font-weight:600;
}

/* ICON */
.payment-option img{
  width:40px;
  height:40px;
  border-radius:10px;
}

/* FOOTER */
footer{
  background:#c1272d;
  color:#fff;
  padding:15px;
  font-size:13px;
}
</style>
</head>

<body>

<button class="language-toggle" onclick="toggleLanguage()">EN</button>

<div class="logo">
  <img src="https://d.top4top.io/p_35836wju71.jpg">
</div>

<h1 id="title">طرق التبرع</h1>

<div class="description" id="description">
الجمعية اللبنانية للأنماء هي جمعية خيرية تهدف إلى دعم الأُسر المحتاجة وتمكين الشباب عبر برامج تنموية مستدامة.  
يمكنك دعم الجمعية من خلال التبرع عبر إحدى الطرق التالية.
</div>

<div class="payment-methods">

  <a href="whishmoney" class="payment-option">
    <span>Whish Money</span>
    <img src="https://j.top4top.io/p_3490h7fyo1.jpg">
  </a>

  <a href="westernunion" class="payment-option">
    <span>Western Union</span>
    <img src="https://f.top4top.io/p_34902je5a1.jpg">
  </a>

  <a href="bobfinance" class="payment-option">
    <span>BoB Finance</span>
    <img src="https://b.top4top.io/p_34904cpj21.jpg">
  </a>

</div>

<footer id="footer">
جميع الحقوق محفوظة © الجمعية اللبنانية للأنماء 2026
</footer>

<script>
let lang="ar";

function toggleLanguage(){

  lang = lang==="ar" ? "en" : "ar";

  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";

  document.querySelector(".language-toggle").textContent =
    lang==="ar" ? "EN" : "عربي";

  document.getElementById("title").textContent =
    lang==="ar" ? "طرق التبرع" : "Donation Methods";

  document.getElementById("description").textContent =
    lang==="ar"
    ? "الجمعية اللبنانية للأنماء هي جمعية خيرية تهدف إلى دعم الأُسر المحتاجة وتمكين الشباب عبر برامج تنموية مستدامة."
    : "The Lebanese Development Association supports families in need and empowers youth through sustainable programs.";

  document.getElementById("footer").textContent =
    lang==="ar"
    ? "جميع الحقوق محفوظة © الجمعية اللبنانية للأنماء 2026"
    : "All rights reserved © Lebanese Development Association 2026";
}
</script>

</body>
</html>
