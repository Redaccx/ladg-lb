<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS مطعم نهائي متكامل</title>
<style>
/* --------- Global --------- */
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(120deg, #0f0c29, #302b63, #24243e);
  color: #f0f0f0;
  overflow-x: hidden;
  transition: background 0.5s ease;
}

h3, h4 {
  margin: 5px 0;
  text-shadow: 1px 1px 5px #000;
}

/* --------- Header --------- */
.header {
  background: linear-gradient(90deg, #1f1c2c, #928dab);
  color: #fff;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  position: sticky;
  top: 0;
  z-index: 100;
  animation: slideDown 0.5s ease;
}

@keyframes slideDown {
  from { transform: translateY(-50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.header button {
  margin-left: 8px;
  padding: 8px 14px;
  border-radius: 6px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 3px 6px rgba(0,0,0,0.3);
}
.header button:hover {
  transform: scale(1.1) rotate(-2deg);
  box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

/* Color Variants */
.header .new-section { color:#fff; background: #333; }
.header .report { color:#fff; background: #333; }
.header .logout { background: #3498db; color: #333; }

/* --------- Container --------- */
.container {
  display: flex;
  height: 90vh;
  padding: 15px;
  gap: 15px;
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* --------- Products Section --------- */
.products {
  width: 65%;
  padding: 15px;
  background: rgba(30,30,40,0.9);
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  overflow-y: auto;
  backdrop-filter: blur(10px);
  transition: transform 0.3s ease;
}
.products:hover { transform: scale(1.02); }

/* Categories */
.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}
.categories button {
  padding: 10px 16px;
  background: linear-gradient(45deg, #121212, #121212);
  color: #fff;
  border-radius: 8px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
}
.categories button.active, .categories button:hover {
  opacity: 0.85;
  transform: scale(1.1) rotate(-2deg);
}

/* Product Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  margin-top: 15px;
}
.product {
  background: linear-gradient(145deg, #333, #333);
  color: #fff;
  padding: 15px;
  text-align: center;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  transform-style: preserve-3d;
}
.product:hover {
  transform: rotateY(15deg) translateY(-10px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.7);
}
.product button {
  position: absolute;
  color: #fff;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-weight: bold;
  font-size: 14px;
  border: none;
  cursor: pointer;
  z-index: 20;
}

/* Input & Add Buttons */
input, select, .products button.extra {
  padding: 8px;
  margin: 5px 0;
  border-radius: 8px;
  border: none;
  width: 100%;
  box-sizing: border-box;
  background: rgba(255,255,255,0.1);
  color: #fff;
  transition: all 0.3s ease;
}
input:focus, select:focus { background: rgba(255,255,255,0.2); outline: none; }
.products button.extra {
  background: #333;
  color: #fff;
  font-weight: bold;
}
.products button.extra:hover { transform: scale(1.05); }

/* --------- Cart Section --------- */
.cart {
  width: 35%;
  background: rgba(40,40,50,0.95);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  backdrop-filter: blur(8px);
  transition: transform 0.3s ease;
}
.cart:hover { transform: scale(1.02); }
.cart h3 { margin-bottom: 15px; text-shadow: 1px 1px 4px #000; }
.cart-items p {
  margin: 5px 0;
  font-size: 14px;
  transition: all 0.2s ease;
}
.cart-items button {
  background: #e74c3c;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 3px 6px;
  margin-right: 5px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.cart-items button:hover { transform: scale(1.2); }
.cart label {
  font-weight: bold;
  margin-top: 8px;
  display: block;
}
.cart input { padding: 6px; margin: 3px 0 8px 0; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: #fff; }
.cart .total {
  font-weight: bold;
  font-size: 18px;
  margin-top: 15px;
  text-align: center;
  text-shadow: 1px 1px 4px #000;
}
.cart button.save, 
.cart button.clear,
.cart button.delete-order {
  width: 100%;
  padding: 12px 0;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  margin-top: 8px;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

.cart button.save { background: #27ae60; color: #fff; }
.cart button.clear { background: #c0392b; color: #fff; }
.cart button.delete-order { background: #7f8c8d; color: #fff; }
.cart button.save:hover, .cart button.clear:hover, .cart button.delete-order:hover {
  transform: scale(1.05);
  opacity: 1;
}

/* --------- Multi Orders Section --------- */
.order-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  overflow-x: auto;
  padding: 5px 0;
}
.order-tab {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.order-tab.active {
  background: #e67e22;
  font-weight: bold;
}

/* --------- Login Box --------- */
.login-box {
  max-width: 380px;
  margin: 150px auto;
  background: rgba(20,20,30,0.95);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  text-align: center;
  color: #fff;
  animation: fadeIn 1s ease;
}
.login-box input {
  padding: 12px;
  margin: 8px 0;
  width: 100%;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: #fff;
  transition: all 0.3s ease;
}
.login-box button {
  margin-top: 12px;
  padding: 12px 20px;
  background: linear-gradient(45deg, #2980b9, #6dd5fa);
  color: #fff;
  border-radius: 10px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

/* --------- Modal --------- */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(0,0,0,0.8);
  overflow-y: auto;
  padding: 40px 0;
  z-index: 9999;
}
.modal-content {
  background-color: rgba(25, 25, 35, 0.98);
  margin: 40px auto;
  padding: 25px;
  border-radius: 15px;
  width: 500px;
  max-width: 90%;
  max-height: 95vh;
  overflow-y: auto;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
  text-align: right;
  position: relative;
  color: #fff;
}
.modal-content input, .modal-content select, .modal-content button {
  margin: 8px 0;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: #fff;
}
.modal-content .close {
  position: absolute;
  top: 12px;
  left: 15px;
  font-size: 24px;
  cursor: pointer;
  color: #fff;
}

.search-container { flex: 1; margin: 0 10px; }
#searchProduct {
    width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
    color: #fff;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s ease;
}

.product .edit-btn { top: 8px; left: 8px; background: orange; }
.product .delete-btn { top: 8px; right: 8px; background: red; }

/* المخفي الافتراضي للفاتورة الحرارية داخل المتصفح */
#invoice { display: none; }

/* إعدادات عزل واجهة التطبيق تماماً وطباعة الفاتورة الحرارية فقط بنقاء */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
  }
  #loginPage, #app, .modal, .header, .container {
    display: none !important;
  }
  #invoice {
    display: block !important;
    width: 80mm; /* المقاس القياسي العالمي المعتمد لطابعات الفواتير بالمطاعم */
    margin: 0;
    padding: 0;
  }
}
</style>
</head>

<body>

<!-- صفحة تسجيل الدخول -->
<div id="loginPage" class="login-box">
  <h3>تسجيل دخول النظام</h3>
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<!-- شاشة التطبيق الرئيسية -->
<div id="app" style="display:none;">

  <!-- شريط الهيدر العلوي -->
  <div class="header">
    <div id="userInfo"></div>
    <div class="search-container">
      <input type="text" id="searchProduct" placeholder="🔎 بحث سريع عن منتج..." oninput="searchProducts()">
    </div>
    <div>
      <button onclick="createNewOrder()" style="color:#ffffff;background:#e67e22;">طلب جديد</button>
      <button class="new-section" onclick="openSectionModal()">إدارة الأقسام والمنتجات</button>
      <button class="report" onclick="toggleDailyReport()">تقرير اليوم</button>
      <button id="profitBtn" onclick="showProfitStats()" style="background:#8e44ad;color:white;">إحصائيات الربح</button>
      <button class="logout" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="container">
    <!-- قسم الفئات والمنتجات -->
    <div class="products">
      <h3>الفئات</h3>
      <div class="categories" id="categories"></div>
      
      <div class="order-tabs" id="openOrders"></div>

      <h3>المنتجات</h3>
      <div class="grid" id="productGrid"></div>
      <br><br>
      <button class="extra" onclick="addExtra()">إضافة بند اكسترا مخصص</button>
    </div>

    <!-- سلة الحسابات الحالية للطلب -->
    <div class="cart">
      <h3 id="cartTitle">الطلب الحالي</h3>
      <div class="cart-items" id="cartItems"></div>

      <label>ضريبة %</label>
      <input type="number" id="tax" value="0" oninput="renderCart()">

      <label>خصم ($)</label>
      <input type="number" id="discount" value="0" oninput="renderCart()">

      <div class="total" id="total">المجموع: 0</div>

      <button class="save" onclick="saveOrder()">طباعة فاتورة وتخزين</button>
      <hr>
      <button class="clear" onclick="clearCart()">مسح السلة</button>
      <button class="delete-order" onclick="deleteCurrentOrder()">حذف وإلغاء الطلب بالكامل</button>
    </div>
  </div>
</div>

<!-- مودال التقارير والتحكم -->
<div id="dailyReportModal" class="modal">
  <div class="modal-content" style="width:600px; max-width:95%;">
    <span class="close" onclick="closeDailyReport()">&times;</span>
    <h3 id="reportModalTitle">تقرير العمليات</h3>
    <div id="dailyReportContent" style="max-height:500px; overflow:auto; text-align:right;"></div>
  </div>
</div>

<!-- مودال إدارة الأقسام والمنتجات -->
<div id="sectionModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeSectionModal()">&times;</span>
    <h3>إدارة الأقسام والمنتجات</h3>
    <h4>إضافة قسم جديد</h4>
    <input type="text" id="modalNewCategory" placeholder="اسم القسم">
    <button onclick="addCategoryModal()" style="color: #ffffff;background:#333333;">إضافة قسم</button>
    
    <h4>الأقسام الحالية</h4>
    <select id="categorySelectList"></select>
    <div style="display:flex; gap:6px;">
      <button onclick="editSelectedCategory()" style="background:#3498db;color:white;">✏ تعديل القسم</button>
      <button onclick="deleteSelectedCategory()" style="background:#e74c3c;color:white;">🗑 حذف القسم</button>
    </div>
    <hr>
    <h4>إضافة منتج جديد</h4>
    <input type="text" id="modalNewName" placeholder="اسم المنتج">
    <input type="number" id="modalNewPrice" placeholder="السعر بالدولار ($)">
    <input type="number" id="modalNewCost" placeholder="كلفة المنتج ($)">
    <input type="text" id="modalNewBarcode" placeholder="رقم الباركود">
    <input type="number" id="modalNewStock" placeholder="الكمية في المخزون">
    <select id="modalCategorySelect"></select>
    <button onclick="addProductModal()" style="color:#ffffff;background:#333333;">إضافة منتج</button>
  </div>
</div>

<!-- مودال تعديل منتج معين -->
<div id="editProductModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeEditProductModal()">&times;</span>
    <h3>تعديل المنتج</h3>
    <input type="hidden" id="editProductId">
    <label>اسم المنتج:</label>
    <input type="text" id="editProductName">
    <label>السعر بالدولار ($):</label>
    <input type="number" id="editProductPrice">
    <label>الكلفة ($):</label>
    <input type="number" id="editProductCost">
    <label>القسم:</label>
    <select id="editProductCategory"></select>
    <label>رقم الباركود:</label>
    <input type="text" id="editProductBarcode">
    <label>الكمية في المخزون:</label>
    <input type="number" id="editProductStock">
    <button onclick="saveEditedProduct()" style="background:#27ae60;color:white;">حفظ التعديلات</button>
  </div>
</div>

<!-- حاوية معالجة طباعة الفاتورة النقدية للمطعم مقاس 80mm حراري -->
<div id="invoice"></div>

<!-- سكربتات Firebase المعتمدة للمشروع -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// إعدادات وبيانات الاتصال بـ Firebase قاعدة البيانات
const firebaseConfig={
  apiKey: "AIzaSyBQBGGtON-RNk4qH2Pws3RBBBE3cH3J4PU",
  authDomain: "store-app-d05fa.firebaseapp.com",
  projectId: "store-app-d05fa",
  storageBucket: "store-app-d05fa.firebasestorage.app",
  messagingSenderId: "257385912042",
  appId: "1:257385912042:web:bc30397b745340e31e2993"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let allProducts = [];
let currentCategory = "all";
let categoriesData = [];
let orders = {};
let currentOrderId = null;
let unsubscribeProducts = null;
let orderCounterGlobal = 1;

const USD_TO_LBP = 89000;

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    const userDoc = await db.collection("users").doc(user.uid).get();
    
    if (!userDoc.exists) {
      alert("حسابك غير مسجل في صلاحيات النظام.");
      await auth.signOut();
      return;
    }
    
    const role = userDoc.data().role;
    currentUser.role = role;
    document.getElementById("userInfo").innerText = currentUser.email + " | " + (role === 'admin' ? 'مدير النظام' : 'كاشير');
    
    applyPermissions(role);
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";
    
    orders = {};
    currentOrderId = null;
    
    await loadCategories();
    listenToProductsRealtime();
    await createNewOrder();
  } else {
    document.getElementById("loginPage").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  if(!email || !password) return alert("يرجى إدخال كافة الحقول المطلوبة");
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (error) {
    alert("فشل تسجيل الدخول: تحقق من صحة البيانات المكتوبة");
  }
}

function applyPermissions(role) {
  const sectionBtn = document.querySelector(".new-section");
  const reportBtn = document.querySelector(".report");
  const profitBtn = document.getElementById("profitBtn");
  
  if (role === "admin") {
    if (sectionBtn) sectionBtn.style.display = "inline-block";
    if (reportBtn) reportBtn.style.display = "inline-block";
    if (profitBtn) profitBtn.style.display = "inline-block";
  } else {
    if (sectionBtn) sectionBtn.style.display = "none";
    if (reportBtn) reportBtn.style.display = "none";
    if (profitBtn) profitBtn.style.display = "none";
  }
}

function logout() {
  if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
  auth.signOut();
  location.reload();
}

async function loadCategories() {
  const div = document.getElementById("categories");
  div.innerHTML = "";
  
  const allBtn = document.createElement("button");
  allBtn.textContent = "الكل";
  allBtn.classList.add("active");
  allBtn.onclick = function() { showProducts('all', allBtn); };
  div.appendChild(allBtn);
  
  const snap = await db.collection("categories").get();
  snap.forEach(doc => {
    const cat = doc.data().name;
    const btn = document.createElement("button");
    btn.textContent = cat;
    btn.onclick = function() { showProducts(cat, btn); };
    div.appendChild(btn);
  });
}

function listenToProductsRealtime() {
  if (unsubscribeProducts) unsubscribeProducts();
  unsubscribeProducts = db.collection("products").onSnapshot(snapshot => {
    allProducts = [];
    snapshot.forEach(doc => {
      const p = doc.data();
      p.id = doc.id;
      allProducts.push(p);
    });
    showProducts(currentCategory);
  });
}

function showProducts(cat, button) {
  currentCategory = cat;
  document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
  if (button) button.classList.add("active");
  
  let filtered = cat === "all" ? allProducts : allProducts.filter(p => p.category === cat);
  renderProducts(filtered);
}

function renderProducts(products) {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  
  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";
    
    if ((p.stock || 0) <= 0) {
      div.style.opacity = "0.5";
    } else if ((p.stock || 0) < 5) {
      div.style.border = "2px solid orange";
    }
    
    let adminButtons = "";
    if (currentUser && currentUser.role === "admin") {
      adminButtons = `
        <button class="edit-btn" onclick="editProductPopup('${p.id}')">✏</button>
        <button class="delete-btn" onclick="deleteProduct('${p.id}')">X</button>
      `;
    }
    
    div.innerHTML = `
      <strong>${p.name}</strong><br><small>${p.category}</small><br>
      ${p.price}$ (${(p.price * USD_TO_LBP).toLocaleString()} ل.ل)
      <br>المخزون: ${p.stock || 0}
      ${adminButtons}
    `;
    
    div.onclick = function(e) {
      if (e.target.tagName === "BUTTON") return;
      if ((p.stock || 0) <= 0) return alert("هذا المنتج غير متوفر في المستودع والمخزون الحالي حالياً!");
      addToCart(p);
    };
    grid.appendChild(div);
  });
}

function searchProducts() {
  const value = document.getElementById("searchProduct").value.toLowerCase();
  let base = currentCategory === "all" ? allProducts : allProducts.filter(p => p.category === currentCategory);
  const filtered = base.filter(p => p.name.toLowerCase().includes(value) || p.barcode?.includes(value));
  renderProducts(filtered);
}

async function createNewOrder() {
  const orderId = "طلب-" + orderCounterGlobal++;
  orders[orderId] = [];
  currentOrderId = orderId;
  renderOpenOrders();
  renderCart();
}

function switchOrder(orderId) {
  currentOrderId = orderId;
  renderOpenOrders();
  renderCart();
}

function renderOpenOrders() {
  const div = document.getElementById("openOrders");
  div.innerHTML = "";
  Object.keys(orders).forEach(id => {
    const btn = document.createElement("button");
    btn.className = "order-tab" + (id === currentOrderId ? " active" : "");
    btn.innerText = id;
    btn.onclick = () => switchOrder(id);
    div.appendChild(btn);
  });
}

function addToCart(product) {
  if (!currentOrderId) return alert("الرجاء فتح طلب جديد أولاً للبيع");
  let cart = orders[currentOrderId];
  let existing = cart.find(item => item.productId === product.id);
  
  if (existing) {
    if (existing.qty + 1 > (product.stock || 0)) return alert("الكمية المطلوبة تتعدى المخزون الفعلي");
    existing.qty += 1;
    existing.total = existing.price * existing.qty;
  } else {
    cart.push({
      productId: product.id,
      name: product.name,
      price: product.price,
      cost: product.cost || 0,
      qty: 1,
      total: product.price
    });
  }
  renderCart();
}

function renderCart() {
  const div = document.getElementById("cartItems");
  div.innerHTML = "";
  
  document.getElementById("cartTitle").innerText = currentOrderId ? `تفاصيل (${currentOrderId})` : "لا يوجد طلب مفتوح";
  if (!currentOrderId) return;
  
  const cart = orders[currentOrderId];
  let subtotal = 0;
  
  cart.forEach((item, index) => {
    subtotal += item.total;
    const p = document.createElement("p");
    p.innerHTML = `${item.name} × ${item.qty} = ${item.total.toFixed(2)}$ 
      <button onclick="removeItem(${index})">❌</button>`;
    div.appendChild(p);
  });
  
  const tax = parseFloat(document.getElementById("tax").value) || 0;
  const discount = parseFloat(document.getElementById("discount").value) || 0;
  
  const totalUSD = subtotal + (subtotal * tax / 100) - discount;
  const totalLBP = totalUSD * USD_TO_LBP;
  
  document.getElementById("total").innerText = `المجموع النهائي: ${totalUSD.toFixed(2)}$ (${totalLBP.toLocaleString()} ل.ل)`;
}

function removeItem(index) {
  if (currentOrderId && orders[currentOrderId]) {
    orders[currentOrderId].splice(index, 1);
    renderCart();
  }
}

function clearCart() {
  if (currentOrderId && orders[currentOrderId]) {
    if (confirm("هل أنت متأكد من مسح جميع محتويات السلة؟")) {
      orders[currentOrderId] = [];
      renderCart();
    }
  }
}

function deleteCurrentOrder() {
  if (!currentOrderId) return alert("لا يوجد طلب مفتوح لحذفه");
  
  if (confirm(`هل أنت متأكد من حذف وإلغاء ${currentOrderId} بالكامل؟`)) {
    delete orders[currentOrderId];
    const remainingOrders = Object.keys(orders);
    
    if (remainingOrders.length > 0) {
      currentOrderId = remainingOrders[remainingOrders.length - 1];
    } else {
      currentOrderId = null;
    }
    
    renderOpenOrders();
    renderCart();
  }
}

function addExtra() {
  if (!currentOrderId) return alert("أنشئ طلب أولاً");
  const name = prompt("اسم البند المخصص الاضافي:");
  if (!name) return;
  const qty = parseFloat(prompt("الكمية:"));
  if (!qty || qty <= 0) return alert("الكمية غير صحيحة");
  const totalPrice = parseFloat(prompt("إجمالي السعر ($):"));
  if (!totalPrice || totalPrice <= 0) return alert("السعر غير صحيح");
  
  orders[currentOrderId].push({
    name: name + " (Extra)",
    price: totalPrice / qty,
    cost: 0,
    qty: qty,
    total: totalPrice
  });
  renderCart();
}

async function saveOrder() {
  if (!currentOrderId || orders[currentOrderId].length === 0) return alert("السلة فارغة حالياً");
  
  const cartItems = orders[currentOrderId];
  const subtotal = cartItems.reduce((s, i) => s + i.total, 0);
  const tax = parseFloat(document.getElementById("tax").value) || 0;
  const discount = parseFloat(document.getElementById("discount").value) || 0;
  const totalUSD = subtotal + (subtotal * tax / 100) - discount;
  const totalLBP = totalUSD * USD_TO_LBP;
  
  try {
    await db.runTransaction(async (transaction) => {
      for (const item of cartItems) {
        if (!item.productId) continue;
        const productRef = db.collection("products").doc(item.productId);
        const productDoc = await transaction.get(productRef);
        
        if (!productDoc.exists) throw "المنتج غير موجود بقاعدة البيانات!";
        const currentStock = productDoc.data().stock || 0;
        if (currentStock < item.qty) throw `المخزون غير كافي للمنتج: ${item.name}`;
        
        transaction.update(productRef, { stock: currentStock - item.qty });
      }
      
      const saleRef = db.collection("sales").doc();
      transaction.set(saleRef, {
        orderNumber: currentOrderId,
        user: currentUser.email,
        items: cartItems,
        subtotal,
        tax,
        discount,
        totalUSD,
        totalLBP,
        date: new Date().toISOString().split('T')[0],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    
    generateInvoice(currentOrderId, cartItems, subtotal, tax, discount, totalUSD, totalLBP);
    window.print();
    
    delete orders[currentOrderId];
    currentOrderId = null;
    renderOpenOrders();
    renderCart();
    alert("تم حفظ الفاتورة بنجاح وتحديث المستودع!");
  } catch (error) {
    alert("خطأ أثناء تنفيذ العملية: " + error);
  }
}

function generateInvoice(number, items, subtotal, tax, discount, totalUSD, totalLBP) {
  const dateStr = new Date().toLocaleString("ar-EG");
  let html = `
    <div style="font-family:'Courier New', monospace; width:76mm; font-size:13px; text-align:center; padding:5px; color:#000; background:#fff; direction:rtl; margin:0 auto;">
      <h2 style="margin:5px 0; font-size:18px;">فاتورة حساب المطعم</h2>
      <p style="margin:3px 0;">معرّف الطلب: ${number}</p>
      <p style="margin:3px 0;">التاريخ: ${dateStr}</p>
      <p style="margin:3px 0;">الكاشير: ${currentUser.email}</p>
      <hr style="border:none; border-top: 1px dashed #000; margin:10px 0;">
      <table style="width:100%; font-size:13px; border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid #000;">
            <th style="text-align:right; padding:4px 0;">الصنف</th>
            <th style="text-align:center; padding:4px 0;">العدد</th>
            <th style="text-align:left; padding:4px 0;">السعر</th>
          </tr>
        </thead>
        <tbody>
  `;
  items.forEach(item => {
    html += `
          <tr>
            <td style="text-align:right; padding:5px 0; font-weight:bold;">${item.name}</td>
            <td style="text-align:center; padding:5px 0;">x${item.qty}</td>
            <td style="text-align:left; padding:5px 0;">${item.total.toFixed(2)}$</td>
          </tr>
    `;
  });
  html += `
        </tbody>
      </table>
      <hr style="border:none; border-top: 1px dashed #000; margin:10px 0;">
      <div style="text-align:left; font-size:13px; line-height:1.6;">
        <p style="margin:3px 0; display:flex; justify-content:space-between;"><span>المجموع الأولي:</span> <span>${subtotal.toFixed(2)}$</span></p>
        <p style="margin:3px 0; display:flex; justify-content:space-between;"><span>الضريبة:</span> <span>${tax}%</span></p>
        <p style="margin:3px 0; display:flex; justify-content:space-between;"><span>الخصم:</span> <span>${discount}$</span></p>
        <h3 style="margin:5px 0; display:flex; justify-content:space-between; font-size:15px; border-top:1px solid #000; padding-top:5px;"><span>الإجمالي النهائي:</span> <span>${totalUSD.toFixed(2)}$</span></h3>
        <h3 style="margin:5px 0; display:flex; justify-content:space-between; font-size:14px; color:#000;"><span>باللبناني (ل.ل):</span> <span>${totalLBP.toLocaleString()} ل.ل</span></h3>
      </div>
      <hr style="border:none; border-top: 1px dashed #000; margin:10px 0;">
      <p style="font-size:12px; font-weight:bold; margin-top:10px;">شكراً لزيارتكم الكريمة</p>
    </div>
  `;
  document.getElementById("invoice").innerHTML = html;
}

function openSectionModal() {
  if (currentUser.role !== "admin") return alert("غير مصرح لك بالدخول هنا");
  document.getElementById("sectionModal").style.display = "block";
  loadCategoriesModal();
}
function closeSectionModal() { document.getElementById("sectionModal").style.display = "none"; }

async function loadCategoriesModal() {
  const select = document.getElementById("categorySelectList");
  const modalSelect = document.getElementById("modalCategorySelect");
  select.innerHTML = "";
  modalSelect.innerHTML = "";
  
  const snap = await db.collection("categories").get();
  snap.forEach(doc => {
    const option = `<option value="${doc.id}">${doc.data().name}</option>`;
    const optionName = `<option value="${doc.data().name}">${doc.data().name}</option>`;
    select.innerHTML += option;
    modalSelect.innerHTML += optionName;
  });
}

async function addCategoryModal() {
  const name = document.getElementById("modalNewCategory").value.trim();
  if(!name) return alert("الرجاء كتابة اسم الفئة");
  await db.collection("categories").add({ name });
  document.getElementById("modalNewCategory").value = "";
  await loadCategories();
  await loadCategoriesModal();
}

async function editSelectedCategory() {
  const id = document.getElementById("categorySelectList").value;
  if(!id) return alert("حدد قسم أولاً");
  const newName = prompt("اكتب الاسم الجديد للقسم البائع:");
  if(!newName) return;
  await db.collection("categories").doc(id).update({ name: newName });
  await loadCategories();
  await loadCategoriesModal();
}

async function deleteSelectedCategory() {
  const id = document.getElementById("categorySelectList").value;
  if(!id || !confirm("هل أنت متأكد من عملية الحذف للفئة؟")) return;
  await db.collection("categories").doc(id).delete();
  await loadCategories();
  await loadCategoriesModal();
}

async function addProductModal() {
  const name = document.getElementById("modalNewName").value.trim();
  const price = parseFloat(document.getElementById("modalNewPrice").value);
  const cost = parseFloat(document.getElementById("modalNewCost").value) || 0;
  const category = document.getElementById("modalCategorySelect").value;
  const barcode = document.getElementById("modalNewBarcode").value.trim();
  const stock = parseInt(document.getElementById("modalNewStock").value) || 0;
  
  if(!name || isNaN(price)) return alert("يرجى إدخال البيانات الأساسية للمنتج بصورة صحيحة");
  
  await db.collection("products").add({
    name, price, cost, category, barcode, stock,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  alert("تمت إضافة الصنف المالي بنجاح للمستودعات");
  closeSectionModal();
}

async function deleteProduct(id) {
  if(confirm("هل تريد إزالة هذا المنتج نهائياً من القائمة؟")) {
    await db.collection("products").doc(id).delete();
  }
}

async function editProductPopup(id) {
  const p = allProducts.find(item => item.id === id);
  if(!p) return;
  
  document.getElementById("editProductId").value = p.id;
  document.getElementById("editProductName").value = p.name;
  document.getElementById("editProductPrice").value = p.price;
  document.getElementById("editProductCost").value = p.cost || 0;
  document.getElementById("editProductBarcode").value = p.barcode || "";
  document.getElementById("editProductStock").value = p.stock || 0;
  
  const select = document.getElementById("editProductCategory");
  select.innerHTML = "";
  const snap = await db.collection("categories").get();
  snap.forEach(doc => {
    select.innerHTML += `<option value="${doc.data().name}" ${doc.data().name === p.category ? 'selected' : ''}>${doc.data().name}</option>`;
  });
  
  document.getElementById("editProductModal").style.display = "block";
}

function closeEditProductModal() { document.getElementById("editProductModal").style.display = "none"; }

async function saveEditedProduct() {
  const id = document.getElementById("editProductId").value;
  await db.collection("products").doc(id).update({
    name: document.getElementById("editProductName").value,
    price: parseFloat(document.getElementById("editProductPrice").value),
    cost: parseFloat(document.getElementById("editProductCost").value) || 0,
    category: document.getElementById("editProductCategory").value,
    barcode: document.getElementById("editProductBarcode").value,
    stock: parseInt(document.getElementById("editProductStock").value) || 0
  });
  closeEditProductModal();
}

function closeDailyReport() { document.getElementById("dailyReportModal").style.display = "none"; }

async function toggleDailyReport() {
  if (currentUser.role !== "admin") return alert("صلاحية غير كافية للإدارة");
  
  const modal = document.getElementById("dailyReportModal");
  const content = document.getElementById("dailyReportContent");
  document.getElementById("reportModalTitle").innerText = "تقرير المبيعات المباشرة اليوم";
  
  const today = new Date().toISOString().split('T')[0];
  const snap = await db.collection("sales").where("date", "==", today).get();
  
  if (snap.empty) {
    content.innerHTML = "<p>لم يتم العثور على أي فواتير مخزنة لليوم الحالي حتى الآن.</p>";
    modal.style.display = "block";
    return;
  }
  
  let totalUSD = 0, totalLBP = 0, orderCount = 0;
  let itemsHTML = "<table border='1' style='width:100%; text-align:center; border-collapse:collapse; color:#fff;'><thead><tr><th>رقم الطلب</th><th>القيمة الكلية ($)</th><th>المستلم</th></tr></thead><tbody>";
  
  snap.forEach(doc => {
    const data = doc.data();
    totalUSD += data.totalUSD || 0;
    totalLBP += data.totalLBP || 0;
    orderCount++;
    itemsHTML += `<tr><td>${data.orderNumber || 'غير محدد'}</td><td>${(data.totalUSD || 0).toFixed(2)}$</td><td>${data.user || ''}</td></tr>`;
  });
  
  itemsHTML += "</tbody></table>";
  
  content.innerHTML = `
    <h4>إجمالي عدد الفواتير: ${orderCount}</h4>
    <h4>إجمالي المبيعات بالدولار: ${totalUSD.toFixed(2)} $</h4>
    <h4>إجمالي المبيعات بالليرة: ${totalLBP.toLocaleString()} ل.ل</h4>
    <hr>${itemsHTML}
  `;
  modal.style.display = "block";
}

async function showProfitStats() {
  if (currentUser.role !== "admin") return alert("صلاحية غير كافية للإدارة");
  
  const modal = document.getElementById("dailyReportModal");
  const content = document.getElementById("dailyReportContent");
  document.getElementById("reportModalTitle").innerText = "إحصائيات الأرباح اليومية الصافية";
  
  const today = new Date().toISOString().split('T')[0];
  const snap = await db.collection("sales").where("date", "==", today).get();
  
  if (snap.empty) {
    content.innerHTML = "<p>لا توجد بيانات مبيعات متوفرة لليوم لاستخراج صافي الربح منها.</p>";
    modal.style.display = "block";
    return;
  }
  
  let totalRevenue = 0;
  let totalCost = 0;
  
  snap.forEach(doc => {
    const sale = doc.data();
    totalRevenue += sale.totalUSD || 0;
    if (sale.items) {
      sale.items.forEach(item => {
        totalCost += (item.cost || 0) * (item.qty || 0);
      });
    }
  });
  
  const netProfit = totalRevenue - totalCost;
  
  content.innerHTML = `
    <div style="padding:15px; background:rgba(255,255,255,0.05); border-radius:10px;">
      <h3 style="color:#2ecc71;">صافي أرباح اليوم: ${netProfit.toFixed(2)} $</h3>
      <p>إجمالي المدخول العام للبيع: ${totalRevenue.toFixed(2)} $</p>
      <p>إجمالي كلفة المواد الأولية المبيعة: ${totalCost.toFixed(2)} $</p>
    </div>
  `;
  modal.style.display = "block";
}
