<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM Panel متكامل</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;margin:0;}
.container{max-width:700px;margin:auto;padding:20px;}
input,select{width:100%;padding:10px;margin-top:10px;border-radius:6px;border:none;}
button{padding:12px;margin-top:10px;width:100%;background:#3b82f6;border:none;color:white;border-radius:6px;cursor:pointer;}
button:hover{background:#2563eb;}
#dashboard{display:none;}
#orders{list-style:none;padding:0;}
.service-item{background:#1e293b;margin:8px;padding:10px;border-radius:6px;text-align:right;}
.service-item button{width:auto;padding:6px 12px;margin-top:6px;}
</style>
</head>
<body>

<div class="container" id="loginBox">
<h2>تسجيل الدخول / إنشاء حساب</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">دخول</button>
<button onclick="register()">إنشاء حساب</button>
</div>

<div class="container" id="dashboard">
<h2>لوحة التحكم</h2>
<p>رصيدك: <span id="balance">0</span>$</p>
<button onclick="logout()">تسجيل خروج</button>
<hr>

<h3>جميع الخدمات</h3>
<div id="services"></div>
<hr>

<h3>طلباتي</h3>
<ul id="orders"></ul>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyAgqj5rWFXuwldXm5-yFZj0POdS6rRYepo",
    authDomain: "support-c1836.firebaseapp.com",
    projectId: "support-c1836",
    storageBucket: "support-c1836.firebasestorage.app",
    messagingSenderId: "475150183599",
    appId: "1:475150183599:web:4c8a3f40f645b160b0f85a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

// Login
window.login = function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  signInWithEmailAndPassword(auth,email,password).catch(err=>alert(err.message));
}

// Register + automatic balance 0.01$
window.register = function(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth,email,password)
  .then(async (userCredential)=>{
    const user = userCredential.user;
    let initialBalance = 0.01;
    await setDoc(doc(db,"users",user.uid),{email: email,balance: initialBalance,created: Date.now(), uid: user.uid});
    alert(`تم إنشاء الحساب! حصلت على رصيد مجاني ${initialBalance}$`);
  }).catch(err=>alert(err.message));
}

// Logout
window.logout = function(){ signOut(auth); }

// Auth state
onAuthStateChanged(auth, async user=>{
  if(user){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";

    let userRef = doc(db,"users",user.uid);
    let userSnap = await getDoc(userRef);
    if(userSnap.exists()) document.getElementById("balance").innerText = userSnap.data().balance.toFixed(2);

    loadOrders(user.uid);
    loadServices();
  } else {
    document.getElementById("loginBox").style.display="block";
    document.getElementById("dashboard").style.display="none";
  }
});

// Call PHP proxy
async function callAPI(params){
  const res = await fetch("smm_proxy.php",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(params)
  });
  return await res.json();
}

// Load services
async function loadServices(){
  const services = await callAPI({action:"services"});
  let container = document.getElementById("services");
  container.innerHTML = "";
  if(!services || !Array.isArray(services)) { container.innerHTML = "<p>لا توجد خدمات</p>"; return; }

  services.forEach(s=>{
    let div = document.createElement("div");
    div.className = "service-item";
    div.innerHTML = `<strong>${s.name}</strong> | السعر: ${s.rate} | الحد الأدنى: ${s.min} | الحد الأقصى: ${s.max}<br>
                     <input placeholder="رابط الحساب أو البوست" class="link-input">
                     <input placeholder="الكمية" class="qty-input">
                     <button onclick="orderService('${s.service}', this)">اطلب الآن</button>`;
    container.appendChild(div);
  });
}

// Order service
window.orderService = async function(service, btn){
  let parent = btn.parentElement;
  let link = parent.querySelector(".link-input").value;
  let quantity = parseInt(parent.querySelector(".qty-input").value);

  let user = auth.currentUser;
  let userRef = doc(db,"users",user.uid);
  let userSnap = await getDoc(userRef);
  let balance = userSnap.data().balance;
  let cost = 0.01;
  if(balance < cost){ alert("رصيدك غير كافي"); return; }

  await updateDoc(userRef,{ balance: balance - cost });

  const data = await callAPI({action:"add",service,link,quantity});
  if(!data){ alert("حدث خطأ في الطلب"); return; }

  document.getElementById("balance").innerText = (balance-cost).toFixed(2);

  await addDoc(collection(db,"orders"),{
    user: user.uid,
    service,
    link,
    quantity,
    status: "pending",
    created: Date.now()
  });

  loadOrders(user.uid);
}

// Load user orders
async function loadOrders(uid){
  let ordersEl = document.getElementById("orders");
  ordersEl.innerHTML = "";
  const query = await getDocs(collection(db,"orders"));
  query.forEach(doc=>{
    let data = doc.data();
    if(data.user === uid){
      let li = document.createElement("li");
      li.innerText = `${data.service} | ${data.quantity} | ${data.status || "pending"}`;
      ordersEl.appendChild(li);
    }
  });
}
</script>
</body>
</html>
