<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنشور</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f3f3f3;
}

/* HEADER */
header{
  background:#C1272D;
  color:#fff;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back-btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.lang-btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

/* CARD */
.card{
  max-width:650px;
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.content{
  padding:16px;
}

h2{
  color:#C1272D;
  margin-bottom:8px;
}

p{
  line-height:1.8;
  color:#333;
}

small{
  display:block;
  margin-top:10px;
  color:gray;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:8px;
  padding:12px;
  background:#fafafa;
  border-top:1px solid #eee;
}

.btn{
  flex:1;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  color:#fff;
  font-size:13px;
}

.copy{background:#444;}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.link{background:#C1272D;}

/* loading */
#loading{
  text-align:center;
  margin-top:70px;
  color:gray;
}
</style>
</head>

<body>

<header>
  <button class="back-btn" onclick="history.back()" id="backBtn">← رجوع</button>

  <h3 id="title">منشور الجمعية</h3>

  <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
</header>

<div id="loading">⏳ جاري التحميل...</div>

<div class="card" id="post" style="display:none;"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBFMkZ7DFGLgshb3C104ORveF8wGvfncmY",
  authDomain: "alanmaa-lb.firebaseapp.com",
  projectId: "alanmaa-lb"
});

const db = firebase.firestore();

/* ===== LANGUAGE ===== */
let lang = localStorage.getItem("lang") || "ar";

function applyLang(){
  document.documentElement.lang = lang;
  document.body.dir = (lang === "en") ? "ltr" : "rtl";

  document.getElementById("langBtn").innerText = (lang === "en") ? "AR" : "EN";
  document.getElementById("title").innerText = (lang === "en") ? "Post" : "منشور الجمعية";
  document.getElementById("backBtn").innerText = (lang === "en") ? "Back" : "رجوع";
}

function toggleLang(){
  lang = (lang === "ar") ? "en" : "ar";
  localStorage.setItem("lang", lang);
  loadPost(); // 🔥 يعيد تحميل وترجمة
  applyLang();
}

applyLang();

/* TRANSLATE */
async function translate(text){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
    const data = await res.json();
    return data.responseData.translatedText;
  }catch(e){
    return text;
  }
}

/* LIKE */
function isLiked(id){
  return (JSON.parse(localStorage.getItem("likes")||"[]")).includes(id);
}

function toggleLike(id){
  const heart = document.getElementById("heart");
  let arr = JSON.parse(localStorage.getItem("likes")||"[]");

  if(arr.includes(id)){
    arr = arr.filter(x=>x!==id);
    heart.classList.remove("active");
  } else {
    arr.push(id);
    heart.classList.add("active");
  }

  localStorage.setItem("likes", JSON.stringify(arr));
}

/* SHARE */
function shareWA(title,url){
  window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(title+"\n"+url));
}

function shareFB(url){
  window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url));
}

function copyLink(url){
  navigator.clipboard.writeText(url);
  alert(lang === "en" ? "Copied ✔" : "تم النسخ ✔");
}

/* LOAD POST */
async function loadPost(){

  const id = new URLSearchParams(window.location.search).get("id");

  const loading = document.getElementById("loading");
  const box = document.getElementById("post");

  if(!id){
    loading.innerText = "❌ No ID";
    return;
  }

  try{

    const doc = await db.collection("news").doc(id).get();

    if(!doc.exists){
      loading.innerText = "❌ Not found";
      return;
    }

    const d = doc.data();
    const url = window.location.href;

    let title = d.title || "";
    let content = d.content || "";

    if(lang === "en"){
      title = await translate(title);
      content = await translate(content);
    }

    box.innerHTML = `
      <img src="${d.image || ''}">

      <div class="content">
        <h2>${title}</h2>
        <p>${content}</p>

        <small>🗓️ ${d.date ? new Date(d.date).toLocaleString("ar-LB") : ''}</small>

        <div id="heart" class="heart ${isLiked(id)?'active':''}" onclick="toggleLike('${id}')">♥</div>
      </div>

      <div class="actions">
        <button class="btn copy" onclick="copyLink('${url}')">نسخ</button>
        <button class="btn wa" onclick="shareWA('${title}','${url}')">واتساب</button>
        <button class="btn fb" onclick="shareFB('${url}')">فيسبوك</button>
        <button class="btn link" onclick="copyLink('${url}')">رابط</button>
      </div>
    `;

    loading.style.display="none";
    box.style.display="block";

  } catch(err){
    console.log(err);
    loading.innerText="❌ خطأ في الاتصال";
  }
}

loadPost();
</script>

</body>
</html>
