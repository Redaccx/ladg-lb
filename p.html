<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنشور</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f3f3f3;
}

/* HEADER */
header{
  background:#C1272D;
  color:#fff;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back-btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* CARD */
.card{
  max-width:650px;
  margin:20px auto;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  cursor:pointer;
}

.content{
  padding:16px;
}

h2{color:#C1272D;}
p{line-height:1.8;color:#333;}
small{display:block;margin-top:10px;color:gray;}

/* LIKE */
.heart{
  font-size:26px;
  cursor:pointer;
  color:#aaa;
  display:inline-block;
  margin-top:8px;
}
.heart.active{color:red;}

/* ACTIONS */
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  padding:15px;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  color:#fff;
}

.copy{background:#444;}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.link{background:#C1272D;}

#loading{
  text-align:center;
  margin-top:70px;
  color:gray;
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup-content{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  animation:pop .25s ease;
}

.popup-content img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.popup-body{
  padding:15px;
}

.popup-body h3{
  margin:0 0 10px;
  color:#C1272D;
}

.popup-body p{
  font-size:14px;
  line-height:1.7;
}

.close{
  position:absolute;
  top:10px;
  right:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:#fff;
  font-size:16px;
}

@keyframes pop{
  from{transform:scale(0.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
</style>
</head>

<body>

<header>
  <button class="back-btn" onclick="history.back()">← رجوع</button>
  <h3>منشور الجمعية</h3>
</header>

<div id="loading">⏳ جاري التحميل...</div>

<div class="card" id="post" style="display:none;"></div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <button class="close" onclick="closePopup()">✖</button>
    <img id="popupImg">
    <div class="popup-body">
      <h3 id="popupTitle"></h3>
      <p id="popupText"></p>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBFMkZ7DFGLGshb3C104ORveF8wGvfncmY",
  authDomain: "alanmaa-lb.firebaseapp.com",
  projectId: "alanmaa-lb"
});

const db = firebase.firestore();

/* ===== POPUP ===== */
function openPopup(title,text,img){
  document.getElementById("popupTitle").innerText = title || "";
  document.getElementById("popupText").innerText = text || "";
  document.getElementById("popupImg").src = img || "";
  document.getElementById("popup").style.display = "flex";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

document.getElementById("popup").addEventListener("click",function(e){
  if(e.target === this) closePopup();
});

/* COPY */
function copyText(text){
  navigator.clipboard.writeText(text);
  alert("تم النسخ ✔");
}

/* SHARE */
function shareWA(t,c,u){
  window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(t+"\n\n"+c+"\n\n"+u));
}

function shareFB(u){
  window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(u));
}

/* LIKE */
function isLiked(id){
  return (JSON.parse(localStorage.getItem("likes")||"[]")).includes(id);
}

function toggleLike(id){
  const heart=document.getElementById("heart");
  let arr=JSON.parse(localStorage.getItem("likes")||"[]");

  if(arr.includes(id)){
    arr = arr.filter(x=>x!==id);
    heart.classList.remove("active");
  }else{
    arr.push(id);
    heart.classList.add("active");
  }

  localStorage.setItem("likes",JSON.stringify(arr));
}

/* LOAD POST FROM ID */
async function loadPost(){

  const id = new URLSearchParams(window.location.search).get("id");

  const loading = document.getElementById("loading");
  const box = document.getElementById("post");

  if(!id){
    loading.innerText = "❌ لا يوجد ID في الرابط";
    return;
  }

  try{

    const doc = await db.collection("news").doc(id).get();

    if(!doc.exists){
      loading.innerText = "❌ المنشور غير موجود";
      return;
    }

    const d = doc.data();
    const url = window.location.href;

    box.innerHTML = `
      <img src="${d.image || ''}" onclick="openPopup('${d.title}','${d.content}','${d.image}')">

      <div class="content">
        <h2>${d.title || ''}</h2>
        <p>${d.content || ''}</p>

        <small>🗓️ ${d.date ? new Date(d.date).toLocaleString("ar-LB") : ''}</small>

        <div id="heart" class="heart ${isLiked(id)?'active':''}" onclick="toggleLike('${id}')">♥</div>
      </div>

      <div class="actions">
        <button class="copy" onclick="copyText(\`${d.content || ''}\`)">نسخ</button>
        <button class="wa" onclick="shareWA(\`${d.title || ''}\`,\`${d.content || ''}\`,'${url}')">واتساب</button>
        <button class="fb" onclick="shareFB('${url}')">فيسبوك</button>
        <button class="link" onclick="copyText('${url}')">رابط</button>
      </div>
    `;

    loading.style.display="none";
    box.style.display="block";

  }catch(err){
    console.log(err);
    loading.innerText="❌ خطأ في الاتصال";
  }
}

loadPost();
</script>

</body>
</html>
