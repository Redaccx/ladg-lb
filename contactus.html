<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>تواصل معنا</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#eef2f7,#dbe4f0);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#222;
}

/* CARD */
.card{
  background:#fff;
  width:100%;
  max-width:520px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.12);
  padding:28px 24px;
  margin:20px;
  box-sizing:border-box;
}

/* TITLE */
h1{
  text-align:center;
  margin:0 0 10px;
  color:#c1272d;
  font-size:24px;
}

/* LANG BUTTON */
.langBtn{
  display:block;
  margin:0 auto 18px;
  background:#c1272d;
  color:white;
  border:none;
  padding:8px 16px;
  border-radius:25px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}
.langBtn:hover{
  transform:scale(1.05);
  background:#a61f24;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* LABEL */
label{
  font-weight:600;
  font-size:14px;
  margin-bottom:5px;
  display:block;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:15px;
  box-sizing:border-box;
  transition:0.2s;
}

/* FOCUS */
input:focus,select:focus,textarea:focus{
  border-color:#c1272d;
  box-shadow:0 0 0 3px rgba(193,39,45,0.15);
  outline:none;
}

/* TEXTAREA */
textarea{
  min-height:120px;
  resize:vertical;
}

/* BUTTON */
.submitBtn{
  background:linear-gradient(135deg,#c1272d,#e63946);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:40px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 10px 20px rgba(193,39,45,0.25);
}

.submitBtn:hover{
  transform:scale(1.05);
}

/* STATUS */
.status{
  display:none;
  padding:10px;
  border-radius:10px;
  font-size:14px;
  text-align:center;
}

.status.ok{
  display:block;
  background:#d1fae5;
  color:#065f46;
}

.status.err{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

/* MOBILE */
@media(max-width:600px){
  .card{
    margin:15px;
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="card">

<h1 id="formTitle">📩 تواصل معنا</h1>

<button class="langBtn" id="toggleLang">English</button>

<form id="contactForm" action="https://formspree.io/f/myzngwrp" method="POST">

  <div>
    <label id="labelName">الاسم الكامل *</label>
    <input name="name" required>
  </div>

  <div>
    <label id="labelEmail">البريد الإلكتروني *</label>
    <input name="email" type="email" required>
  </div>

  <div>
    <label id="labelPhone">رقم الهاتف</label>
    <input name="phone" type="tel">
  </div>

  <div>
    <label id="labelTopic">الموضوع *</label>
    <select name="topic" required>
      <option hidden>اختر موضوع الرسالة</option>
      <option>تقديم طلب تطوع</option>
      <option>تقديم طلب عمل</option>
      <option>استفسار</option>
      <option>دعم فني</option>
      <option>مقترح</option>
      <option>شكوى</option>
      <option>أخرى</option>
    </select>
  </div>

  <div>
    <label id="labelMessage">الرسالة *</label>
    <textarea name="message" required></textarea>
  </div>

  <button type="submit" class="submitBtn" id="submitBtn">إرسال</button>

  <div id="formStatus" class="status"></div>

</form>

</div>

<script>
const form = document.getElementById('contactForm');
const statusBox = document.getElementById('formStatus');
const btn = document.getElementById('submitBtn');
const toggleBtn = document.getElementById('toggleLang');

let lang = 'ar';

toggleBtn.addEventListener('click', ()=>{
  lang = lang === 'ar' ? 'en' : 'ar';

  document.documentElement.lang = lang;
  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.getElementById('formTitle').textContent =
    lang === 'ar' ? '📩 تواصل معنا' : '📩 Contact Us';

  document.getElementById('labelName').textContent =
    lang === 'ar' ? 'الاسم الكامل *' : 'Full Name *';

  document.getElementById('labelEmail').textContent =
    lang === 'ar' ? 'البريد الإلكتروني *' : 'Email *';

  document.getElementById('labelPhone').textContent =
    lang === 'ar' ? 'رقم الهاتف' : 'Phone';

  document.getElementById('labelTopic').textContent =
    lang === 'ar' ? 'الموضوع *' : 'Topic *';

  document.getElementById('labelMessage').textContent =
    lang === 'ar' ? 'الرسالة *' : 'Message *';

  btn.textContent = lang === 'ar' ? 'إرسال' : 'Send';
  toggleBtn.textContent = lang === 'ar' ? 'English' : 'عربي';
});

form.addEventListener('submit', async (e)=>{
  e.preventDefault();

  statusBox.style.display = "block";
  statusBox.className = "status";
  statusBox.textContent = lang === 'ar' ? "جارٍ الإرسال..." : "Sending...";
  btn.disabled = true;

  try{
    const res = await fetch(form.action,{
      method:"POST",
      body:new FormData(form),
      headers:{'Accept':'application/json'}
    });

    if(res.ok){
      form.reset();
      statusBox.className="status ok";
      statusBox.textContent = lang==='ar' ? "تم الإرسال بنجاح ✅" : "Sent successfully ✅";
    }else{
      throw new Error();
    }
  }catch{
    statusBox.className="status err";
    statusBox.textContent = lang==='ar' ? "فشل الإرسال ❌" : "Failed ❌";
  }finally{
    btn.disabled=false;
  }
});
</script>

</body>
</html>
