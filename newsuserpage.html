<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأخبار</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f5f5f5;
}

/* HEADER */
header{
  background:#C1272D;
  color:#fff;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  font-size:16px;
  margin:0;
}

.btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:5px 10px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

/* GRID */
.posts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.post{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 12px rgba(0,0,0,0.08);
  cursor:pointer;
}

.post img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.post-body{
  padding:10px;
}

.post h3{
  margin:0;
  font-size:15px;
  color:#C1272D;
}

.date{
  font-size:12px;
  color:gray;
  margin-top:5px;
}

/* POPUP */
.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  justify-content:center;
  align-items:center;
  padding:15px;
}

.popup-content{
  background:#fff;
  width:100%;
  max-width:500px;
  border-radius:16px;
  overflow:hidden;
  position:relative;
}

.popup img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.popup-body{
  padding:15px;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
  border:none;
  padding:9px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
  font-size:13px;
}

.copy{background:#444;}
.wa{background:#25D366;}
.fb{background:#1877F2;}

.close{
  position:absolute;
  top:10px;
  right:10px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  background:#C1272D;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <button class="btn" onclick="history.back()" id="backBtn">← رجوع</button>
  <h1 id="title">آخر الأخبار</h1>
  <button class="btn" onclick="toggleLang()" id="langBtn">EN</button>
</header>

<div id="posts" class="posts-grid"></div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closePopup(event)">
  <div class="popup-content">

    <button class="close" onclick="closePopup(event)">×</button>

    <img id="popupImg">

    <div class="popup-body">
      <h3 id="popupTitle"></h3>
      <p id="popupText"></p>
      <small id="popupDate"></small>

      <div class="actions">
        <button class="copy" onclick="copyLink()">رابط</button>
        <button class="wa" onclick="shareWA()">واتساب</button>
        <button class="fb" onclick="shareFB()">فيسبوك</button>
      </div>

    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBFMkZ7DFGLgshb3C104ORveF8wGvfncmY",
  authDomain: "alanmaa-lb.firebaseapp.com",
  projectId: "alanmaa-lb"
});

const db = firebase.firestore();

let current = {
  id:"",
  title:"",
  url:""
};

/* LANG */
let lang = localStorage.getItem("lang") || "ar";

function applyLang(){
  document.documentElement.lang = lang;
  document.body.dir = (lang === "en") ? "ltr" : "rtl";

  document.getElementById("langBtn").innerText = (lang === "en") ? "AR" : "EN";
  document.getElementById("title").innerText = (lang === "en") ? "Latest News" : "آخر الأخبار";
  document.getElementById("backBtn").innerText = (lang === "en") ? "Back" : "رجوع";
}

function toggleLang(){
  lang = (lang === "ar") ? "en" : "ar";
  localStorage.setItem("lang", lang);
  applyLang();
  loadPosts();
}

applyLang();

/* TRANSLATE */
async function translate(text){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
    const data = await res.json();
    return data.responseData.translatedText;
  }catch(e){
    return text;
  }
}

/* LOAD POSTS */
async function loadPosts(){
  const postsDiv = document.getElementById("posts");
  postsDiv.innerHTML="";

  const snap = await db.collection("news").orderBy("date","desc").get();

  snap.forEach(async doc=>{
    const d = doc.data();

    let title = d.title || "";

    if(lang === "en"){
      title = await translate(title);
    }

    const div = document.createElement("div");
    div.className="post";

    div.innerHTML=`
      <img src="${d.image||''}">
      <div class="post-body">
        <h3>${title}</h3>
        <div class="date">🗓️ ${d.date ? new Date(d.date).toLocaleDateString() : ""}</div>
      </div>
    `;

    div.onclick = ()=> openPost(doc.id, d);

    postsDiv.appendChild(div);
  });
}

/* OPEN POST */
async function openPost(id, data){

  current.id = id;

  let title = data.title || "";
  let content = data.content || "";

  if(lang === "en"){
    title = await translate(title);
    content = await translate(content);
  }

  current.title = title;

  current.url = window.location.origin + window.location.pathname + "?id=" + id;

  document.getElementById("popupImg").src = data.image || "";
  document.getElementById("popupTitle").innerText = title;
  document.getElementById("popupText").innerText = content;
  document.getElementById("popupDate").innerText =
    data.date ? new Date(data.date).toLocaleString() : "";

  document.getElementById("popup").style.display="flex";
}

/* COPY LINK */
function copyLink(){
  navigator.clipboard.writeText(current.url);
  alert(lang === "en" ? "Link Copied ✔" : "تم نسخ الرابط ✔");
}

/* SHARE */
function shareWA(){
  window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(current.title+"\n"+current.url));
}

function shareFB(){
  window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(current.url));
}

/* CLOSE */
function closePopup(e){
  if(!e || e.target.classList.contains("close") || e.target.id==="popup"){
    document.getElementById("popup").style.display="none";
  }
}

/* OPEN BY ID */
window.onload = () => {
  const id = new URLSearchParams(window.location.search).get("id");

  if(id){
    db.collection("news").doc(id).get().then(doc=>{
      if(doc.exists){
        openPost(doc.id, doc.data());
      }
    });
  }
};

loadPosts();
</script>

</body>
</html>
