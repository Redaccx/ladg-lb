<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آخر الأخبار</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f6f6f6;
}

header{
  background:#C1272D;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  font-size:18px;
  margin:0;
}

.btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

/* GRID */
.posts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:15px;
  padding:15px;
}

/* CARD */
.post{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.3s;
}

.post:hover{
  transform:translateY(-5px);
}

.post img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.post h3{
  margin:10px;
  color:#C1272D;
  font-size:16px;
}

.post small{
  display:block;
  margin:0 10px 10px;
  color:gray;
}

/* ACTIONS */
.actions{
  display:flex;
  justify-content:center;
  gap:6px;
  padding:10px;
}

.btn-share{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  color:#fff;
}

.whatsapp{background:#25D366;}
.facebook{background:#1877F2;}
.link{background:#444;}

/* POPUP */
.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}

.popup-content{
  background:#fff;
  width:90%;
  max-width:500px;
  border-radius:16px;
  padding:15px;
  position:relative;
}

.close-btn{
  position:absolute;
  top:10px;
  left:10px;
  background:#C1272D;
  color:#fff;
  border:none;
  width:30px;
  height:30px;
  border-radius:50%;
  cursor:pointer;
}

.popup img{
  width:100%;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <button class="btn" onclick="window.location.href='index.html'">رجوع</button>
  <h1>آخر الأخبار</h1>
  <button class="btn">EN</button>
</header>

<div id="posts" class="posts-grid"></div>

<div id="popup" class="popup" onclick="closePopup(event)">
  <div class="popup-content" id="popupContent"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBFMkZ...",
  authDomain: "alanmaa-lb.firebaseapp.com",
  projectId: "alanmaa-lb",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const postsDiv = document.getElementById("posts");

/* تحميل */
async function loadPosts(){
  postsDiv.innerHTML = "";

  const snapshot = await db.collection("news").orderBy("date","desc").get();

  snapshot.forEach(doc=>{
    const data = doc.data();
    const id = doc.id;

    const url = `https://alanmaa-lb.com/p?id=${id}`;

    const card = document.createElement("div");
    card.className = "post";

    card.innerHTML = `
      <img src="${data.image || ''}">
      <h3>${data.title || ''}</h3>
      <small>🗓️ ${data.date ? new Date(data.date).toLocaleDateString() : ''}</small>

      <div class="actions">
        <button class="btn-share link" onclick="copyLink('${url}');event.stopPropagation()">🔗</button>
        <button class="btn-share whatsapp" onclick="shareWA('${data.title}','${data.content}','${url}');event.stopPropagation()">💬</button>
        <button class="btn-share facebook" onclick="shareFB('${url}');event.stopPropagation()">📘</button>
      </div>
    `;

    card.onclick = ()=> openPost(data,id,url);

    postsDiv.appendChild(card);
  });
}

/* Popup */
function openPost(data,id,url){
  document.getElementById("popupContent").innerHTML = `
    <button class="close-btn" onclick="closePopup(event)">×</button>
    <img src="${data.image}">
    <h3>${data.title}</h3>
    <p>${data.content}</p>
    <small>ID: ${id}</small>
  `;

  document.getElementById("popup").style.display = "flex";
}

/* Copy */
function copyLink(url){
  navigator.clipboard.writeText(url);
  alert("تم نسخ الرابط ✔");
}

/* WhatsApp */
function shareWA(title,content,url){
  const text = `${title}\n\n${content}\n\n${url}`;
  window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text));
}

/* Facebook */
function shareFB(url){
  window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url));
}

/* Close */
function closePopup(e){
  if(e.target.id==="popup" || e.target.classList.contains("close-btn")){
    document.getElementById("popup").style.display="none";
  }
}

loadPosts();
</script>

</body>
</html>
