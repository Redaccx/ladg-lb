<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آخر الأخبار</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#f5f5f5;
}

/* HEADER */
header{
  background:#C1272D;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  font-size:18px;
  margin:0;
}

.btn{
  background:#fff;
  color:#C1272D;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

/* GRID */
.posts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:15px;
  padding:15px;
}

.post{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.3s;
}

.post:hover{
  transform:translateY(-5px);
}

.post img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.post h3{
  margin:10px;
  color:#C1272D;
  font-size:16px;
}

.post small{
  display:block;
  margin:0 10px 10px;
  color:gray;
}

/* ===== POPUP ===== */
.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:15px;
}

.popup-content{
  background:#fff;
  width:100%;
  max-width:500px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  animation:pop .25s ease;
}

/* صورة */
.popup-content img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.popup-body{
  padding:15px;
}

.popup-body h3{
  margin:0 0 10px;
  color:#C1272D;
}

.popup-body p{
  font-size:15px;
  line-height:1.7;
}

/* close */
.close-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#C1272D;
  color:#fff;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
}

/* SHARE BOX */
.share-box{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.share-btn{
  flex:1;
  min-width:100px;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
}

.wa{background:#25D366;}
.fb{background:#1877F2;}
.tg{background:#0088cc;}
.copy{background:#444;}

/* animation */
@keyframes pop{
  from{transform:scale(0.85);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
</style>
</head>

<body>

<header>
  <button class="btn" onclick="window.location.href='index.html'">رجوع</button>
  <h1>آخر الأخبار</h1>
  <button class="btn">EN</button>
</header>

<div id="posts" class="posts-grid"></div>

<!-- POPUP -->
<div id="popup" class="popup" onclick="closePopup(event)">
  <div class="popup-content">

    <button class="close-btn" onclick="closePopup(event)">×</button>

    <img id="popupImg">

    <div class="popup-body">
      <h3 id="popupTitle"></h3>
      <p id="popupText"></p>

      <!-- SHARE -->
      <div class="share-box">
        <button class="share-btn wa" onclick="shareWA()">واتساب</button>
        <button class="share-btn fb" onclick="shareFB()">فيسبوك</button>
        <button class="share-btn tg" onclick="shareTG()">تلغرام</button>
        <button class="share-btn copy" onclick="copyLink()">نسخ الرابط</button>
      </div>

    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBFMkZ7DFGLgshb3C104ORveF8wGvfncmY",
  authDomain: "alanmaa-lb.firebaseapp.com",
  projectId: "alanmaa-lb"
});

const db = firebase.firestore();

let current = {
  title:"",
  content:"",
  image:"",
  url:""
};

/* LOAD POSTS */
async function loadPosts(){
  const postsDiv = document.getElementById("posts");
  postsDiv.innerHTML="";

  const snap = await db.collection("news").orderBy("date","desc").get();

  snap.forEach(doc=>{
    const d = doc.data();

    const div = document.createElement("div");
    div.className="post";

    div.innerHTML=`
      <img src="${d.image||''}">
      <h3>${d.title||''}</h3>
      <small>${d.date ? new Date(d.date).toLocaleDateString() : ''}</small>
    `;

    div.onclick = ()=> openPost(d);

    postsDiv.appendChild(div);
  });
}

/* OPEN POPUP */
function openPost(data){
  current.title = data.title || "";
  current.content = data.content || "";
  current.image = data.image || "";
  current.url = window.location.href;

  document.getElementById("popupImg").src = current.image;
  document.getElementById("popupTitle").innerText = current.title;
  document.getElementById("popupText").innerText = current.content;

  document.getElementById("popup").style.display="flex";
}

/* CLOSE */
function closePopup(e){
  if(!e || e.target.id==="popup" || e.target.classList.contains("close-btn")){
    document.getElementById("popup").style.display="none";
  }
}

/* SHARE */
function shareWA(){
  window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(current.title+"\n"+current.url));
}

function shareFB(){
  window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(current.url));
}

function shareTG(){
  window.open("https://t.me/share/url?url="+encodeURIComponent(current.url)+"&text="+encodeURIComponent(current.title));
}

function copyLink(){
  navigator.clipboard.writeText(current.url);
  alert("تم نسخ الرابط ✔");
}

loadPosts();
</script>

</body>
</html>
